<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Training Diary logo">
  <rect width="1200" height="1200" fill="#020406"/>

  <g transform="translate(600 440)">
    <!-- Blue track loop -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="#0f4f8d" stroke-width="42" stroke-dasharray="1400 760" transform="rotate(16)"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#0f4f8d" stroke-width="42" stroke-dasharray="1100 590" transform="rotate(16)"/>

    <!-- Gold track loop -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="#d9a924" stroke-width="42" stroke-dasharray="1400 760" transform="rotate(196)"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#d9a924" stroke-width="42" stroke-dasharray="1100 590" transform="rotate(196)"/>

    <!-- Stopwatch -->
    <g transform="translate(0 -245)">
      <circle cx="0" cy="0" r="70" fill="none" stroke="#d9a924" stroke-width="18"/>
      <circle cx="0" cy="0" r="55" fill="none" stroke="#d9a924" stroke-width="10"/>
      <path d="M0 -46 L0 -18 M0 0 L28 18 M0 0 L-18 33" stroke="#d9a924" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M-18 -48 L18 -48" stroke="#d9a924" stroke-width="10" stroke-linecap="round"/>
      <path d="M-8 -62 L8 -62" stroke="#d9a924" stroke-width="10" stroke-linecap="round"/>
      <path d="M0 -82 L0 -60" stroke="#d9a924" stroke-width="12" stroke-linecap="round"/>
      <path d="M-80 76 L0 0 L74 76" stroke="#d9a924" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <g fill="#d9a924">
        <rect x="-18" y="-100" width="36" height="18" rx="8"/>
        <rect x="-18" y="90" width="36" height="18" rx="8"/>
      </g>
    </g>

    <!-- Notebook -->
    <g>
      <path d="M-215 38 H170 C203 38 220 55 220 88 V188 C220 220 198 238 170 238 H-155 C-174 238 -190 224 -190 205 V60 C-190 49 -201 38 -215 38Z" fill="#0d1a21" opacity="0.2"/>
      <rect x="-180" y="34" width="360" height="210" rx="22" fill="none" stroke="#d9a924" stroke-width="16"/>
      <path d="M-18 34 V244" stroke="#d9a924" stroke-width="12"/>
      <path d="M-180 88 H180" stroke="#d9a924" stroke-width="10" opacity="0.9"/>
      <path d="M-180 130 H180" stroke="#d9a924" stroke-width="10" opacity="0.9"/>
      <path d="M-180 172 H180" stroke="#d9a924" stroke-width="10" opacity="0.9"/>
      <path d="M-180 214 H180" stroke="#d9a924" stroke-width="10" opacity="0.9"/>
      <path d="M-126 58 L-87 146 L-52 104 L-18 154 L41 88 L103 172 L149 130" fill="none" stroke="#d9a924" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="150" cy="128" r="10" fill="#d9a924"/>
      <path d="M-158 124 H-108" stroke="#d9a924" stroke-width="8" stroke-linecap="round"/>
      <path d="M-158 172 H-108" stroke="#d9a924" stroke-width="8" stroke-linecap="round"/>
      <path d="M-158 220 H-108" stroke="#d9a924" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Inner track accent lines -->
    <path d="M-338 0 C-220 -62, -90 -70, 0 -12 C 100 50, 170 44, 246 6" fill="none" stroke="#d9a924" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
    <path d="M-338 0 C-220 62, -90 70, 0 12 C 100 -50, 170 -44, 246 -6" fill="none" stroke="#0f4f8d" stroke-width="16" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g transform="translate(600 940)">
    <text x="0" y="0" text-anchor="middle" font-size="170" font-weight="700" letter-spacing="10" fill="#dfe4ea" font-family="Arial, Helvetica, sans-serif">TRAINING</text>
    <text x="0" y="160" text-anchor="middle" font-size="170" font-weight="700" letter-spacing="12" fill="#dfe4ea" font-family="Arial, Helvetica, sans-serif">DIARY</text>
  </g>
</svg>
