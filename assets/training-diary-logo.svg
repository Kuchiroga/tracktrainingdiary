<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="Training Diary logo">
  <rect width="1600" height="1200" fill="#020406"/>

  <g transform="translate(800 430)">
    <!-- Blue track loop -->
    <path d="M -355 0
             A 255 255 0 1 1 355 0
             A 255 255 0 1 1 -355 0" fill="none" stroke="#0d4d8a" stroke-width="44" stroke-linecap="round"/>
    <path d="M -285 0
             A 205 205 0 1 1 285 0
             A 205 205 0 1 1 -285 0" fill="none" stroke="#0d4d8a" stroke-width="44" stroke-linecap="round"/>

    <!-- Gold track loop -->
    <path d="M -355 0
             A 255 255 0 1 0 355 0
             A 255 255 0 1 0 -355 0" fill="none" stroke="#d7a71b" stroke-width="44" stroke-linecap="round"/>
    <path d="M -285 0
             A 205 205 0 1 0 285 0
             A 205 205 0 1 0 -285 0" fill="none" stroke="#d7a71b" stroke-width="44" stroke-linecap="round"/>

    <!-- center notebook -->
    <g transform="translate(0 28)">
      <rect x="-200" y="-120" width="400" height="260" rx="20" fill="none" stroke="#d7a71b" stroke-width="18"/>
      <path d="M0 -120 V140" stroke="#d7a71b" stroke-width="12"/>
      <path d="M-200 0 H200" stroke="#d7a71b" stroke-width="12" opacity="0.95"/>
      <path d="M-200 60 H200" stroke="#d7a71b" stroke-width="12" opacity="0.95"/>
      <path d="M-200 120 H200" stroke="#d7a71b" stroke-width="12" opacity="0.95"/>
      <path d="M-200 180 H200" stroke="#d7a71b" stroke-width="12" opacity="0.95"/>
      <path d="M-120 -80 L-80 18 L-40 -18 L9 45 L74 -25 L120 40 L170 -25" fill="none" stroke="#d7a71b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="171" cy="-26" r="12" fill="#d7a71b"/>
      <path d="M-132 45 H-60" stroke="#d7a71b" stroke-width="9" stroke-linecap="round"/>
      <path d="M-132 100 H-60" stroke="#d7a71b" stroke-width="9" stroke-linecap="round"/>
      <path d="M-132 155 H-60" stroke="#d7a71b" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- stopwatch -->
    <g transform="translate(0 -250)">
      <circle cx="0" cy="0" r="86" fill="none" stroke="#d7a71b" stroke-width="18"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="#d7a71b" stroke-width="10"/>
      <path d="M0 -58 L0 -24 M0 0 L28 24 M0 0 L-18 34" stroke="#d7a71b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M-20 -64 L20 -64" stroke="#d7a71b" stroke-width="12" stroke-linecap="round"/>
      <path d="M-8 -76 L8 -76" stroke="#d7a71b" stroke-width="12" stroke-linecap="round"/>
      <path d="M0 -92 L0 -70" stroke="#d7a71b" stroke-width="12" stroke-linecap="round"/>
      <path d="M-92 92 L0 0 L94 92" stroke="#d7a71b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="-22" y="-110" width="44" height="18" rx="9" fill="#d7a71b"/>
      <rect x="-22" y="90" width="44" height="18" rx="9" fill="#d7a71b"/>
    </g>
  </g>

  <g transform="translate(800 978)">
    <text x="0" y="0" text-anchor="middle" font-size="172" font-weight="700" letter-spacing="8" fill="#dfe5ec" font-family="Arial, Helvetica, sans-serif">TRAINING</text>
    <text x="0" y="168" text-anchor="middle" font-size="172" font-weight="700" letter-spacing="10" fill="#dfe5ec" font-family="Arial, Helvetica, sans-serif">DIARY</text>
  </g>
</svg>
