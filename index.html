    <style>
      :root {
        --bg: #05080d;
        --bg-2: #0d121b;
        --panel: rgba(12, 17, 24, 0.82);
        --panel-strong: rgba(16, 23, 30, 0.96);
        --surface: rgba(18, 24, 32, 0.9);
        --surface-2: rgba(255, 255, 255, 0.02);
        --line: rgba(159, 175, 196, 0.18);
        --text: #ebf1f8;
        --muted: #a0aec0;
        --primary: #0f4f8d;
        --primary-soft: rgba(15, 79, 141, 0.24);
        --accent: #d9a924;
        --accent-soft: rgba(217, 169, 36, 0.16);
        --success: #79d7b5;
        --shadow: 0 20px 60px rgba(2, 6, 13, 0.5);
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(15, 79, 141, 0.22), transparent 28%),
          radial-gradient(circle at bottom right, rgba(217, 169, 36, 0.12), transparent 22%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        font-family: "Plus Jakarta Sans", "Segoe UI", Roboto, Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background-attachment: fixed;
      }

      #root {
        min-height: 100vh;
        padding: 22px;
        box-sizing: border-box;
      }

      #root > * {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      * {
        box-sizing: border-box;
      }

      button, input, select, textarea {
        font-family: inherit;
      }

      button, [type="button"], [type="submit"], [role="button"] {
        background: linear-gradient(180deg, rgba(15, 79, 141, 0.96) 0%, rgba(12, 59, 106, 1) 100%);
        color: var(--text);
        border: 1px solid rgba(142, 184, 228, 0.32);
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(15, 79, 141, 0.24);
        transition: transform 0.12s ease, filter 0.18s ease, border-color 0.18s ease;
      }

      button:hover, [type="button"]:hover, [type="submit"]:hover, [role="button"]:hover {
        filter: brightness(1.05);
      }

      button:active, [type="button"]:active, [type="submit"]:active, [role="button"]:active {
        transform: translateY(1px);
      }

      input, select, textarea {
        background: rgba(255,255,255,0.02);
        color: var(--text);
        border: 1px solid rgba(160, 174, 192, 0.2);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .metric-card, .panel, .card, .stat, .summary, .surface {
        background: linear-gradient(180deg, rgba(15, 21, 29, 0.92), rgba(12, 17, 24, 0.92)) !important;
        border: 1px solid var(--line) !important;
        border-radius: 18px !important;
        box-shadow: none !important;
      }

      .text-slate-100,
      .text-slate-200,
      .text-slate-300,
      .text-slate-400,
      .bg-slate-950,
      .bg-slate-900,
      body.bg-slate-950 {
        color: var(--text) !important;
        background: transparent !important;
      }

      .text-slate-500,
      .text-slate-600,
      .text-slate-700,
      .text-slate-400 {
        color: var(--muted) !important;
      }

      .border-slate-800,
      .border-slate-700,
      .border-slate-600,
      .border-slate-500 {
        border-color: var(--line) !important;
      }

      .shadow-lg,
      .shadow-xl,
      .shadow-md {
        box-shadow: none !important;
      }

      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.02);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(159, 175, 196, 0.28);
        border-radius: 999px;
      }

      ::selection {
        background: rgba(217, 169, 36, 0.28);
      }
    </style>
    <script>
      (function () {
        function removeZeroCostText() {
          const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          const textNodes = [];

          while (walker.nextNode()) {
            const node = walker.currentNode;
            if (node && /zero\s*cost/i.test(node.textContent || '')) {
              textNodes.push(node);
            }
          }

          textNodes.forEach(function (node) {
            const parent = node.parentElement;
            if (!parent) return;

            const container = parent.closest('div, p, span, li, section, header, footer, article, h1, h2, h3, button');
            if (container) {
              container.style.display = 'none';
            }
          });
        }

        const run = function () {
          removeZeroCostText();
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', run, { once: true });
        } else {
          run();
        }

        const observer = new MutationObserver(run);
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true,
          characterData: true
        });
      })();
    </script>
